<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Arte dos emails do Authik</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #888; padding: 40px; display: grid; gap: 40px; justify-content: start; }
  section { position: relative; overflow: hidden; }
  .logo { display: flex; align-items: center; gap: 10px; width: max-content; }
  .logo svg { width: 40px; height: 40px; }
  .logo span { font: 700 28px/1 'Geist', sans-serif; letter-spacing: -.03em; color: #111117; }
  .logo.dark span { color: #f3f3f6; }
  .icon { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; }
  .icon svg { width: 34px; height: 34px; }
</style></head><body>

<section data-art="logo" data-w="auto" data-h="44" class="logo">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#5850ec"/><path d="M16 7.5 23 10v5.6c0 4.3-2.9 7.6-7 8.9-4.1-1.3-7-4.6-7-8.9V10z" fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"/><path d="m12.8 16 2.3 2.3 4.2-4.4" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>Authik</span>
</section>
<section data-art="logo-dark" data-w="auto" data-h="44" class="logo dark">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#7c7bff"/><path d="M16 7.5 23 10v5.6c0 4.3-2.9 7.6-7 8.9-4.1-1.3-7-4.6-7-8.9V10z" fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"/><path d="m12.8 16 2.3 2.3 4.2-4.4" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>Authik</span>
</section>

<!-- ícone: envelope (confirmar e-mail) -->
<section data-art="icone-email" data-w="64" data-h="64" class="icon" style="background:#ecebff;">
  <svg viewBox="0 0 24 24" fill="none" stroke="#5850ec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
</section>
<!-- ícone: cadeado (senha alterada) -->
<section data-art="icone-senha" data-w="64" data-h="64" class="icon" style="background:#fff1e8;">
  <svg viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="#c2410c"/></svg>
</section>
</body></html>
