<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Arte dos emails da MS Corretora (conceito)</title>
<style>
  :root { --navy: #0c1f4a; --orange: #f07820; --deep: #c05508; --sky: #e8eefb; --line: #d6dcea; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #888; padding: 40px; display: grid; gap: 40px; justify-content: start; }
  section { position: relative; overflow: hidden; }
  .logo { width: max-content; } .logo img { display: block; height: 52px; }

  /* renovação: carro + calendário */
  .renew { width: 600px; height: 320px; background: var(--sky); }
  .cal { position: absolute; right: 70px; top: 50px; width: 170px; height: 190px; border-radius: 16px; background: #fff; box-shadow: 0 18px 40px rgba(12,31,74,.16); overflow: hidden; }
  .cal .top { height: 48px; background: var(--navy); }
  .cal .rings { position: absolute; top: -8px; left: 0; right: 0; display: flex; justify-content: space-around; } .cal .rings i { width: 12px; height: 28px; border-radius: 6px; background: var(--orange); }
  .cal .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 18px 16px; }
  .cal .days i { height: 18px; border-radius: 5px; background: var(--sky); }
  .cal .days i.on { background: var(--orange); }
  .car { position: absolute; left: 50px; top: 120px; width: 300px; }
  .road { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #cfd8ec; }
  .road::after { content: ""; position: absolute; left: 0; right: 0; top: 21px; height: 4px; background: repeating-linear-gradient(90deg, #fff 0 30px, transparent 30px 60px); }

  /* boas-vindas: escudo com coberturas */
  .welcome { width: 600px; height: 320px; background: var(--navy); }
  .shield { position: absolute; left: 230px; top: 44px; width: 140px; }
  .orbit { position: absolute; width: 64px; height: 64px; border-radius: 18px; background: #16306a; display: grid; place-items: center; }
  .orbit svg { width: 32px; height: 32px; }
</style></head><body>
