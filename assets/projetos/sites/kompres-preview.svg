<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prévia visual do Kompres</title>
  <desc id="desc">Interface escura de um compressor de imagens com área de upload e controles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171818"/>
      <stop offset="1" stop-color="#090a0a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1320" cy="85" r="270" fill="#b8f55a" opacity=".06"/>
  <circle cx="190" cy="950" r="360" fill="#b8f55a" opacity=".035"/>

  <g transform="translate(105 72)">
    <rect width="1390" height="856" rx="32" fill="#111212" stroke="#343635" stroke-width="2" filter="url(#shadow)"/>
    <rect width="1390" height="74" rx="32" fill="#1a1b1b"/>
    <path d="M0 74H1390" stroke="#353736"/>
    <circle cx="38" cy="37" r="8" fill="#5b5d5c"/>
    <circle cx="65" cy="37" r="8" fill="#5b5d5c"/>
    <circle cx="92" cy="37" r="8" fill="#5b5d5c"/>
    <rect x="448" y="20" width="494" height="34" rx="17" fill="#111212" stroke="#303231"/>

    <g transform="translate(58 112)">
      <rect width="42" height="42" rx="12" fill="#b8f55a"/>
      <path d="M12 12v18h5v-7l9 7h7L21 20l11-8h-8l-7 6v-6z" fill="#101110"/>
      <text x="58" y="31" fill="#f3f1eb" font-family="Arial, sans-serif" font-size="30" font-weight="700">Kompres</text>

      <text x="0" y="144" fill="#f3f1eb" font-family="Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">Imagens leves.</text>
      <text x="0" y="216" fill="#f3f1eb" font-family="Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">Site mais <tspan fill="#b8f55a">rápido.</tspan></text>
      <text x="0" y="268" fill="#979b98" font-family="Arial, sans-serif" font-size="23">Comprima e converta imagens direto no navegador.</text>

      <g transform="translate(0 326)">
        <rect width="1274" height="390" rx="24" fill="#171818" stroke="#3a3d3b"/>
        <g transform="translate(34 30)">
          <text x="0" y="24" fill="#f3f1eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Compressor e conversor de imagens</text>
          <text x="0" y="56" fill="#8f9390" font-family="Arial, sans-serif" font-size="17">Arraste imagens, escolha o formato e gere versões otimizadas.</text>

          <g transform="translate(0 92)">
            <rect width="356" height="72" rx="14" fill="#202221" stroke="#393c3a"/>
            <text x="22" y="28" fill="#969a97" font-family="Arial, sans-serif" font-size="14">QUALIDADE</text>
            <text x="290" y="30" fill="#b8f55a" font-family="Arial, sans-serif" font-size="20" font-weight="700">82%</text>
            <rect x="22" y="48" width="312" height="5" rx="3" fill="#383b39"/>
            <rect x="22" y="48" width="246" height="5" rx="3" fill="#b8f55a"/>
          </g>

          <g transform="translate(380 92)">
            <rect width="370" height="72" rx="14" fill="#202221" stroke="#393c3a"/>
            <text x="22" y="28" fill="#969a97" font-family="Arial, sans-serif" font-size="14">FORMATO DE SAÍDA</text>
            <rect x="185" y="16" width="58" height="38" rx="9" fill="#b8f55a"/>
            <text x="200" y="41" fill="#111" font-family="Arial, sans-serif" font-size="14" font-weight="700">WebP</text>
            <text x="260" y="41" fill="#b7bbb8" font-family="Arial, sans-serif" font-size="14">PNG</text>
            <text x="310" y="41" fill="#b7bbb8" font-family="Arial, sans-serif" font-size="14">JPEG</text>
          </g>

          <g transform="translate(0 188)">
            <rect width="1206" height="142" rx="18" fill="#141515" stroke="#4a4d4a" stroke-dasharray="10 10"/>
            <circle cx="603" cy="50" r="22" fill="#262927"/>
            <path d="M603 38v25m-10-10 10 10 10-10" fill="none" stroke="#b8f55a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="603" y="96" text-anchor="middle" fill="#f3f1eb" font-family="Arial, sans-serif" font-size="18" font-weight="700">Arraste as imagens aqui</text>
            <text x="603" y="121" text-anchor="middle" fill="#858986" font-family="Arial, sans-serif" font-size="14">PNG, WebP ou JPEG</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
