          <path d="m4 8 3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="24" y="13" fill="#767a77" font-family="Arial, sans-serif" font-size="13">Salvo automaticamente</text>
        </g>
      </g>

      <g transform="translate(482 98)">
