<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prévia visual do Email Generator</title>
  <desc id="desc">Interface de um gerador de email com controles à esquerda e preview à direita.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff0ec"/>
      <stop offset="1" stop-color="#dfe1dc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#101010" flood-opacity=".20"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="300" fill="#0f0f0f" opacity=".035"/>
  <circle cx="140" cy="930" r="350" fill="#0f0f0f" opacity=".025"/>

  <g transform="translate(105 72)">
    <rect width="1390" height="856" rx="32" fill="#f7f7f3" stroke="#c9cbc6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="1390" height="74" rx="32" fill="#111212"/>
    <path d="M0 74H1390" stroke="#2d2f2e"/>
    <circle cx="38" cy="37" r="8" fill="#616462"/>
    <circle cx="65" cy="37" r="8" fill="#616462"/>
    <circle cx="92" cy="37" r="8" fill="#616462"/>
    <rect x="448" y="20" width="494" height="34" rx="17" fill="#1c1d1d" stroke="#343636"/>

    <g transform="translate(48 104)">
