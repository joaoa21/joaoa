        <text x="28" y="40" fill="#171818" font-family="Arial, sans-serif" font-size="18" font-weight="700">Configurações</text>
        <path d="M28 58H422" stroke="#e4e5e1"/>

        <text x="28" y="96" fill="#6d716e" font-family="Arial, sans-serif" font-size="13" font-weight="700">TÍTULO DO EMAIL</text>
        <rect x="28" y="112" width="394" height="48" rx="10" fill="#f3f4f1" stroke="#d9dbd6"/>
        <text x="44" y="143" fill="#313432" font-family="Arial, sans-serif" font-size="15">Sua promoção está disponível</text>

        <text x="28" y="198" fill="#6d716e" font-family="Arial, sans-serif" font-size="13" font-weight="700">TEXTO</text>
        <rect x="28" y="214" width="394" height="112" rx="10" fill="#f3f4f1" stroke="#d9dbd6"/>
        <rect x="44" y="234" width="310" height="8" rx="4" fill="#a9ada9"/>
        <rect x="44" y="257" width="346" height="8" rx="4" fill="#c0c3bf"/>
        <rect x="44" y="280" width="280" height="8" rx="4" fill="#c0c3bf"/>

        <text x="28" y="365" fill="#6d716e" font-family="Arial, sans-serif" font-size="13" font-weight="700">BOTÃO</text>
        <rect x="28" y="381" width="394" height="48" rx="10" fill="#f3f4f1" stroke="#d9dbd6"/>
        <text x="44" y="412" fill="#313432" font-family="Arial, sans-serif" font-size="15">Aproveitar agora</text>

