            <rect x="0" y="0" width="472" height="118" rx="12" fill="#111212"/>
            <text x="236" y="54" text-anchor="middle" fill="#f2f0eb" font-family="Arial, sans-serif" font-size="25" font-weight="700">SUA MARCA</text>
            <text x="236" y="83" text-anchor="middle" fill="#aeb1ae" font-family="Arial, sans-serif" font-size="13">EMAIL MARKETING</text>
            <text x="236" y="164" text-anchor="middle" fill="#171818" font-family="Arial, sans-serif" font-size="24" font-weight="700">Uma oferta feita para você</text>
            <rect x="72" y="198" width="328" height="7" rx="4" fill="#bfc2bd"/>
            <rect x="100" y="222" width="272" height="7" rx="4" fill="#d0d2ce"/>
            <rect x="136" y="246" width="200" height="7" rx="4" fill="#d0d2ce"/>
            <rect x="145" y="286" width="182" height="48" rx="9" fill="#111212"/>
            <text x="236" y="316" text-anchor="middle" fill="#f2f0eb" font-family="Arial, sans-serif" font-size="14" font-weight="700">APROVEITAR AGORA</text>
