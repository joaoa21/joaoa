          <text x="92" y="33" text-anchor="middle" fill="#f3f1eb" font-family="Arial, sans-serif" font-size="14" font-weight="700">COPIAR HTML</text>
          <rect x="204" width="190" height="52" rx="11" fill="#ffffff" stroke="#bfc2bd"/>
          <text x="299" y="33" text-anchor="middle" fill="#171818" font-family="Arial, sans-serif" font-size="14" font-weight="700">SALVAR MODELO</text>
        </g>

        <g transform="translate(28 560)">
